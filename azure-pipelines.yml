trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  acrConnection: acr-clinicworks
  azureRmConnection: azure-rm-clinicworks
  acrLoginServer: clinicworksacr.azurecr.io
  imageName: clinicworks-api
  webAppName: app-clinicworks-platform-dev
  functionAppName: func-clinicworks-dev
  resourceGroup: rg-clinicworks-dev

stages:
  - stage: ValidateBicep
    displayName: Validate Infrastructure (Bicep Lint & What-If)
    jobs:
      - job: LintAndPreview
        steps:
          - script: |
              az bicep build --file infra/main.bicep
            displayName: Lint and build Bicep templates

          - task: AzureCLI@2
            displayName: Run Bicep What-If preview
            inputs:
              azureSubscription: $(azureRmConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(resourceGroup) \
                  --template-file infra/main.bicep \
                  --parameters infra/main.parameters.dev.json \
                  --parameters postgresAdminPassword="$(POSTGRES_PASSWORD)" openaiApiKey="$(OPENAI_API_KEY)"

  - stage: ProvisionInfrastructure
    displayName: Provision Azure Infrastructure (Bicep)
    dependsOn: ValidateBicep
    jobs:
      - job: DeployBicep
        steps:
          - task: AzureCLI@2
            displayName: Deploy Bicep templates
            inputs:
              azureSubscription: $(azureRmConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group create \
                  --resource-group $(resourceGroup) \
                  --template-file infra/main.bicep \
                  --parameters infra/main.parameters.dev.json \
                  --parameters postgresAdminPassword="$(POSTGRES_PASSWORD)" openaiApiKey="$(OPENAI_API_KEY)"

  - stage: BuildAndPushApi
    displayName: Build & push api image
    dependsOn: ProvisionInfrastructure
    jobs:
      - job: Docker
        steps:
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrConnection)

          # --provenance=false --sbom=false — buildx's default attestation
          # manifest breaks App Service's pull client (see incident notes).
          - script: |
              docker build --provenance=false --sbom=false \
                -t $(acrLoginServer)/$(imageName):$(Build.BuildId) \
                -t $(acrLoginServer)/$(imageName):latest .
              docker push $(acrLoginServer)/$(imageName):$(Build.BuildId)
              docker push $(acrLoginServer)/$(imageName):latest
            displayName: Build and push image

  - stage: DeployApi
    displayName: Deploy api Web App
    dependsOn: BuildAndPushApi
    jobs:
      - job: Deploy
        steps:
          - task: AzureCLI@2
            displayName: Restart Web App (re-pulls latest image)
            inputs:
              azureSubscription: $(azureRmConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az webapp restart -n $(webAppName) -g $(resourceGroup)

  - stage: DeployFunctions
    displayName: Deploy Function App
    dependsOn: BuildAndPushApi
    jobs:
      - job: Deploy
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: |
              cd apps/functions
              npm ci
              npm run build
            displayName: Install & build functions

          - task: ArchiveFiles@2
            displayName: Zip functions output
            inputs:
              rootFolderOrFile: apps/functions
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/functions.zip

          - task: AzureFunctionApp@2
            displayName: Deploy to Azure Function App
            inputs:
              azureSubscription: $(azureRmConnection)
              appType: functionAppLinux
              appName: $(functionAppName)
              package: $(Build.ArtifactStagingDirectory)/functions.zip
